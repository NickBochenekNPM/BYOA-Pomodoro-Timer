<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Pomodoro</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<div id="app">
		<header class="app-header">
			<h1>Pomodoro</h1>
			<nav class="mode-switcher" role="tablist" aria-label="Timer modes">
				<button class="mode-btn" data-mode="pomodoro" role="tab" aria-selected="true">Pomodoro</button>
				<button class="mode-btn" data-mode="short" role="tab" aria-selected="false">Short Break</button>
				<button class="mode-btn" data-mode="long" role="tab" aria-selected="false">Long Break</button>
			</nav>
		</header>

		<main class="timer-card">
			<div id="time" aria-live="polite" aria-atomic="true">25:00</div>
			<div class="controls">
				<button id="start-pause" class="primary">Start</button>
				<button id="reset" class="ghost">Reset</button>
			</div>
			<div class="session-info">
				<span id="session-label">Focus</span>
				<span>•</span>
				<span id="cycle-label">Cycle 1</span>
			</div>
		</main>

		<footer class="app-footer">
			<button id="open-settings" class="icon-btn" aria-label="Open settings">
				⚙️
			</button>
		</footer>
	</div>

	<!-- Settings Dialog -->
	<dialog id="settings-dialog">
		<form method="dialog" id="settings-form">
			<h2>Settings</h2>
			<div class="field">
				<label for="pomodoro-min">Pomodoro (minutes)</label>
				<input type="number" id="pomodoro-min" min="1" max="120" value="25">
			</div>
			<div class="field">
				<label for="short-min">Short Break (minutes)</label>
				<input type="number" id="short-min" min="1" max="60" value="5">
			</div>
			<div class="field">
				<label for="long-min">Long Break (minutes)</label>
				<input type="number" id="long-min" min="1" max="60" value="15">
			</div>
			<div class="dialog-actions">
				<button value="cancel" class="ghost">Cancel</button>
				<button id="save-settings" value="default" class="primary">Save</button>
			</div>
		</form>
	</dialog>

	<script src="script.js"></script>
</body>
</html>
